[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewarmour"]

[project]
name = "reviewarmour"
version = "0.1.0"
description = "ReviewArmour AI layer: commercial reasoning, self-correction, conversation"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]
tester = [
  "nicegui>=2.0.0",
]
gbp = [
  "playwright>=1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:anthropic.*",
]
