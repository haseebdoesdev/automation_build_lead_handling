[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewarmour", "reviewarmour.*", "api", "api.*"]

[project]
name = "reviewarmour"
version = "0.2.0"
description = "ReviewArmour AI layer + integration API"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "pydantic[email]>=2.0.0",
  "twilio>=9.0.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "alembic>=1.13.0",
]
tester = [
  "nicegui>=2.0.0",
]
gbp = [
  "patchright>=1.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:anthropic.*",
]
